apiVersion: v1
kind: Namespace
metadata:
  name: practice-7
  labels:
    app.kubernetes.io/part-of: calculadora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calculadora-config
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora
data:
  API_HOST: calculadora-backend.practice-7.svc.cluster.local
  API_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: calculadora-backend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-backend
type: Opaque
stringData:
  REQUEST_LOG_FILE: /app/logs/api-requests.txt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calculadora-logs
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-backend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-backend
    spec:
      containers:
        - name: backend
          image: calculadora-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: calculadora-backend
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: request-logs
              mountPath: /app/logs
      volumes:
        - name: request-logs
          persistentVolumeClaim:
            claimName: calculadora-logs
---
apiVersion: v1
kind: Service
metadata:
  name: calculadora-backend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calculadora-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-frontend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-frontend
    spec:
      containers:
        - name: frontend
          image: calculadora-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: calculadora-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: calculadora-frontend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: calculadora-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calculadora-request-logs-cleanup
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-job
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: calculadora-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: calculadora-job:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: calculadora-backend
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: request-logs
                  mountPath: /app/logs
          volumes:
            - name: request-logs
              persistentVolumeClaim:
                claimName: calculadora-logs
