apiVersion: v1
kind: Namespace
metadata:
  name: practice-7
  labels:
    app.kubernetes.io/part-of: calculadora
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calculadora-logs
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-backend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-backend
    spec:
      containers:
        - name: backend
          image: calculadora-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REQUEST_LOG_FILE
              value: /app/logs/api-requests.txt
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: request-logs
              mountPath: /app/logs
      volumes:
        - name: request-logs
          persistentVolumeClaim:
            claimName: calculadora-logs
---
apiVersion: v1
kind: Service
metadata:
  name: calculadora-backend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calculadora-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-frontend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-frontend
    spec:
      containers:
        - name: frontend
          image: calculadora-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_HOST
              value: calculadora-backend.practice-7.svc.cluster.local
            - name: API_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: calculadora-frontend
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: calculadora-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calculadora-request-logs-cleanup
  namespace: practice-7
  labels:
    app.kubernetes.io/name: calculadora-job
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: calculadora-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: calculadora-job:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: REQUEST_LOG_FILE
                  value: /app/logs/api-requests.txt
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: request-logs
                  mountPath: /app/logs
          volumes:
            - name: request-logs
              persistentVolumeClaim:
                claimName: calculadora-logs
